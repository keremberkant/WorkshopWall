<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dunes</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/*
 * Dunes — a sample live wallpaper for WorkshopWall.
 * Single-file WebGL fragment shader; also works in Wallpaper Engine and any browser.
 * Original work, released under the MIT license with the rest of the repository.
 */
(function () {
  // Render below native resolution: these images are soft, and it saves a lot of GPU time.
  var SCALE = 0.6;

  var FRAGMENT = `
precision highp float;
uniform vec2 R;      // canvas size in pixels
uniform float T;     // time in seconds
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++) { v += a * noise(p); p = m * p; a *= 0.5; }
  return v;
}
float ridge(float x, float seed, float t) {
  return 0.06 * sin(x * 2.1 + seed + t) + 0.035 * sin(x * 4.7 - seed * 1.7 - t * 0.6) + 0.04 * fbm(vec2(x * 1.5 + seed, seed));
}
void main() {
  vec2 uv = gl_FragCoord.xy / R;
  vec2 p = (gl_FragCoord.xy - 0.5 * R) / R.y;
  vec3 col = mix(vec3(1.0, 0.62, 0.38), vec3(0.32, 0.27, 0.55), smoothstep(-0.1, 0.5, p.y));
  // sun
  vec2 sc = p - vec2(0.28, 0.06);
  col += vec3(1.0, 0.75, 0.5) * (smoothstep(0.075, 0.07, length(sc)) * 0.9 + 0.35 * exp(-length(sc) * 6.0));
  // haze
  col = mix(col, vec3(1.0, 0.7, 0.55), 0.25 * exp(-abs(p.y + 0.02) * 10.0));
  for (int i = 0; i < 5; i++) {
    float fi = float(i);
    float speed = 0.01 + 0.012 * fi;
    float base = 0.0 - 0.09 * fi;
    float h = base + ridge(p.x * (0.8 + 0.25 * fi) + T * speed, fi * 3.7, T * speed * 0.3);
    vec3 dune = mix(vec3(0.95, 0.55, 0.38), vec3(0.35, 0.12, 0.2), fi / 4.0);
    // simple lighting: sunlit side vs shadow side
    float slope = ridge(p.x * (0.8 + 0.25 * fi) + T * speed + 0.01, fi * 3.7, T * speed * 0.3) - h + base;
    dune *= 0.85 + 0.25 * clamp(slope * 80.0, -1.0, 1.0);
    dune = mix(dune, col, 0.35 * exp(-fi * 0.9) * 0.6);
    col = mix(col, dune, smoothstep(0.003, -0.003, p.y - h));
  }
  col *= 1.0 - 0.25 * dot(uv - 0.5, uv - 0.5);
  gl_FragColor = vec4(col, 1.0);
}
`;

  var canvas = document.getElementById('c');
  var gl = canvas.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: true });
  if (!gl) return;

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, 'attribute vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }'));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAGMENT));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  var uR = gl.getUniformLocation(prog, 'R'), uT = gl.getUniformLocation(prog, 'T');

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(innerWidth * dpr * SCALE));
    canvas.height = Math.max(1, Math.round(innerHeight * dpr * SCALE));
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  addEventListener('resize', function () { resize(); draw(); });
  resize();

  // ?t=12 starts at a fixed time (used for preview images).
  var start = parseFloat(new URLSearchParams(location.search).get('t')) || 5.0;
  var elapsed = start, last = null, paused = false;

  function draw() {
    gl.uniform2f(uR, canvas.width, canvas.height);
    gl.uniform1f(uT, elapsed);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function frame(now) {
    if (paused) { last = null; return; }
    if (last !== null) elapsed += Math.min(0.1, (now - last) / 1000);
    last = now;
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Wallpaper Engine / WorkshopWall call this when the desktop is hidden or the Mac is on battery.
  window.wallpaperPropertyListener = {
    setPaused: function (p) {
      if (p === paused) return;
      paused = p;
      if (!p) requestAnimationFrame(frame);
    }
  };
})();
</script>
</body>
</html>
