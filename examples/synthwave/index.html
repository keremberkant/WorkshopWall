<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Synthwave</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/*
 * Synthwave — a sample live wallpaper for Canlı Duvar.
 * Single-file WebGL fragment shader; also works in Wallpaper Engine and any browser.
 * Original work, released under the MIT license with the rest of the repository.
 */
(function () {
  // Render below native resolution: these images are soft, and it saves a lot of GPU time.
  var SCALE = 0.6;

  var FRAGMENT = `
precision highp float;
uniform vec2 R;      // canvas size in pixels
uniform float T;     // time in seconds
float hash(vec2 p) { p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  mat2 m = mat2(1.6, 1.2, -1.2, 1.6);
  for (int i = 0; i < 5; i++) { v += a * noise(p); p = m * p; a *= 0.5; }
  return v;
}
void main() {
  vec2 p = (gl_FragCoord.xy - 0.5 * R) / R.y;
  float hz = -0.05;
  vec3 col;
  if (p.y > hz) {
    float h = (p.y - hz);
    col = mix(vec3(0.95, 0.3, 0.55), vec3(0.08, 0.02, 0.2), smoothstep(0.0, 0.45, h));
    // stars
    vec2 sp = gl_FragCoord.xy / (R.y / 500.0);
    col += step(0.998, hash(floor(sp))) * smoothstep(0.15, 0.45, h) * 0.8;
    // sun
    vec2 sc = p - vec2(0.0, 0.17);
    float d = length(sc);
    vec3 sun = mix(vec3(1.0, 0.85, 0.3), vec3(1.0, 0.2, 0.55), smoothstep(0.18, -0.18, sc.y));
    float stripes = step(0.0, sin((sc.y + T * 0.02) * 90.0) + 0.9 + sc.y * 10.0);
    float disc = smoothstep(0.205, 0.2, d) * (sc.y > -0.02 ? 1.0 : stripes);
    col = mix(col, sun, disc);
    col += vec3(1.0, 0.3, 0.6) * 0.25 * exp(-d * 5.0);
    // mountains
    float m = hz + 0.07 * fbm(vec2(p.x * 4.0, 3.0)) + 0.04 * abs(sin(p.x * 3.0));
    m *= smoothstep(0.0, 0.5, abs(p.x)) * 1.6;
    if (p.y < hz + m) col = mix(vec3(0.05, 0.0, 0.12), vec3(0.3, 0.05, 0.4), (p.y - hz) / max(m, 0.001) * 0.6);
  } else {
    float dy = hz - p.y + 0.0001;
    float z = 0.12 / dy;
    vec2 g = vec2(p.x * z * 2.0, z + T * 0.8);
    vec2 cell = abs(fract(g) - 0.5);
    // distance to the nearest line in pixels, so lines keep the same width near and far
    float px = R.y / 1000.0;
    float lx = cell.x / (2.0 * z / R.y) / px;
    float ly = cell.y / (0.12 / (dy * dy) / R.y) / px;
    float line = exp(-lx * 0.45) + exp(-ly * 0.45) + 0.35 * (exp(-lx * 0.1) + exp(-ly * 0.1));
    float fade = exp(-z * 0.1) * smoothstep(0.0, 0.03, dy);
    col = vec3(0.04, 0.0, 0.08) + vec3(1.0, 0.2, 0.9) * min(line, 1.5) * fade;
    col += vec3(0.9, 0.2, 0.6) * 0.35 * exp(-(hz - p.y) * 18.0);
  }
  gl_FragColor = vec4(col, 1.0);
}
`;

  var canvas = document.getElementById('c');
  var gl = canvas.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: true });
  if (!gl) return;

  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, 'attribute vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }'));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAGMENT));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  var uR = gl.getUniformLocation(prog, 'R'), uT = gl.getUniformLocation(prog, 'T');

  function resize() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(innerWidth * dpr * SCALE));
    canvas.height = Math.max(1, Math.round(innerHeight * dpr * SCALE));
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  addEventListener('resize', function () { resize(); draw(); });
  resize();

  // ?t=12 starts at a fixed time (used for preview images).
  var start = parseFloat(new URLSearchParams(location.search).get('t')) || 10.0;
  var elapsed = start, last = null, paused = false;

  function draw() {
    gl.uniform2f(uR, canvas.width, canvas.height);
    gl.uniform1f(uT, elapsed);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function frame(now) {
    if (paused) { last = null; return; }
    if (last !== null) elapsed += Math.min(0.1, (now - last) / 1000);
    last = now;
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // Wallpaper Engine / Canlı Duvar call this when the desktop is hidden or the Mac is on battery.
  window.wallpaperPropertyListener = {
    setPaused: function (p) {
      if (p === paused) return;
      paused = p;
      if (!p) requestAnimationFrame(frame);
    }
  };
})();
</script>
</body>
</html>
