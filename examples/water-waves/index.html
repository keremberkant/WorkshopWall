<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Water waves</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Template: an image distorted by one or two "water waves" passes, like Wallpaper Engine's
// Water Waves effect. Put your image next to this file as image.jpg and copy the effect values
// (direction, scale, speed, strength) from the scene's scene.json.
const WAVES = [
  { direction: 6.28, scale: 20.0, speed: 1.0, strength: 0.07 },  // first pass
  { direction: 1.18, scale: 10.0, speed: 1.7, strength: 0.08 },  // second pass
];

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { antialias: false, alpha: false, preserveDrawingBuffer: true, powerPreference: 'low-power' });

const vs = `
attribute vec2 p;
varying vec2 v;
void main() { v = p * 0.5 + 0.5; v.y = 1.0 - v.y; gl_Position = vec4(p, 0.0, 1.0); }`;

const fs = `
precision highp float;
varying vec2 v;
uniform sampler2D img;
uniform float t;
uniform vec2 uvScale, uvOffset;   // screen → image (aspect fill)
uniform vec2 d1, d2;              // wave directions
uniform vec3 w1, w2;              // (speed, scale, strength²)

vec2 wave(vec2 uv, vec2 dir, vec3 w) {
  float dist = t * w.x + dot(uv, dir) * w.y;
  return uv + sin(dist) * vec2(dir.y, -dir.x) * w.z;
}
void main() {
  vec2 uv = v * uvScale + uvOffset;
  // the second pass samples the first pass's output: apply pass 2's offset, then pass 1's
  uv = wave(uv, d2, w2);
  uv = wave(uv, d1, w1);
  gl_FragColor = texture2D(img, uv);
}`;

function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'p');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const U = n => gl.getUniformLocation(prog, n);
// (0,-1) rotated by the angle
const dir = a => [Math.sin(a), -Math.cos(a)];
gl.uniform2fv(U('d1'), dir(WAVES[0].direction));
gl.uniform2fv(U('d2'), dir(WAVES[1].direction));
gl.uniform3f(U('w1'), WAVES[0].speed, WAVES[0].scale, WAVES[0].strength ** 2);
gl.uniform3f(U('w2'), WAVES[1].speed, WAVES[1].scale, WAVES[1].strength ** 2);

let imgW = 1, imgH = 1, ready = false, paused = false, start = performance.now(), pausedAt = 0;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
  // aspect fill ("Cover")
  const sa = canvas.width / canvas.height, ia = imgW / imgH;
  let sx = 1, sy = 1;
  if (sa < ia) sx = sa / ia; else sy = ia / sa;
  gl.uniform2f(U('uvScale'), sx, sy);
  gl.uniform2f(U('uvOffset'), (1 - sx) / 2, (1 - sy) / 2);
}

const image = new Image();
image.onload = () => {
  imgW = image.naturalWidth; imgH = image.naturalHeight;
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, image);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.uniform1i(U('img'), 0);
  ready = true;
  resize();
  requestAnimationFrame(frame);
};
image.src = 'image.jpg';

function frame(now) {
  if (paused) return;
  gl.uniform1f(U('t'), (now - start) / 1000);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}

addEventListener('resize', () => { if (ready) resize(); });

// pause API used by Canli Duvar and Wallpaper Engine
window.wallpaperPropertyListener = {
  applyUserProperties() {},
  setPaused(p) {
    if (p === paused) return;
    paused = p;
    if (p) { pausedAt = performance.now(); }
    else { start += performance.now() - pausedAt; if (ready) requestAnimationFrame(frame); }
  }
};
</script>
</body>
</html>
